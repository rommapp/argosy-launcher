volumes:
  v50_resources:
  v50_redis:
  v50_assets:

services:
  romm-v50:
    image: ghcr.io/rommapp/romm:5.0.0
    container_name: romm-v50
    restart: unless-stopped
    environment:
      - DB_HOST=romm-testbed-db
      - DB_NAME=romm_v50
      - DB_USER=${DB_USER}
      - DB_PASSWD=${DB_PASSWORD}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
      - HASHEOUS_API_ENABLED=true
    volumes:
      - v50_resources:/romm/resources
      - v50_redis:/redis-data
      - v50_assets:/romm/assets
      - ${TESTBED_LIBRARY}:/romm/library:ro
    ports:
      - "8092:8080"
    depends_on:
      romm-testbed-db:
        condition: service_healthy
        restart: true
